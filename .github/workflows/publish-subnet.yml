name: Publish netpulse-subnet to PyPI

on:
  push:
    tags:
      # This workflow will only run when you push a tag like "netpulse-subnet-v0.1.0"
      - 'netpulse-subnet-v*'

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Run Tests
        run: uv run pytest packages/netpulse-subnet/tests/

      - name: Build netpulse-subnet package
        run: uv build packages/netpulse-subnet

      - name: Publish to PyPI
        run: uv publish packages/netpulse-subnet
        env:
          # Ensure you have set PYPI_TOKEN in your GitHub Repository Secrets
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
