[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpulse-core"
version = "0.1.0"
description = "Core utilities for the Netpulse ecosystem"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
]


[tool.uv.sources]
netpulse-rust = { workspace = true }


[tool.hatch.build.targets.wheel]
packages = ["src/netpulse"]
