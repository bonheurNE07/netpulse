[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpulse-ssh"
version = "0.1.6"
description = "High-speed concurrent SSH command runner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncssh>=2.14.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "pydantic>=2.0.0"
]

[project.scripts]
netpulse-ssh = "netpulse.ssh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/netpulse"]
