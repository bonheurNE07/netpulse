[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpulse-subnet"
version = "0.1.4"
description = "Subnetting and network discovery tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.scripts]
netpulse-subnet = "netpulse.subnet.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/netpulse"]
[tool.uv.sources]
netpulse-core = { workspace = true }



