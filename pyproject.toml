[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpulse"
version = "0.1.0.4"
description = "High-performance network discovery and subnet analysis suite with native Rust speed."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "netpulse-core",
    "netpulse-subnet",
]

[project.scripts]
netpulse = "netpulse.netpulse_cli.main:app"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]



[tool.uv.sources]
netpulse-core = { workspace = true }
netpulse-subnet = { workspace = true }


[tool.hatch.build.targets.wheel]
packages = ["src/netpulse"]
